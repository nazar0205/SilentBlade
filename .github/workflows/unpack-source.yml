
name: Unpack SilentBlade v0.8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v0.8
        run: |
          set -euo pipefail
          test -s SilentBlade_v0.8_source.zip
          unzip -tq SilentBlade_v0.8_source.zip
          mkdir -p /tmp/silentblade
          unzip -q SilentBlade_v0.8_source.zip -d /tmp/silentblade
          PROJECT_FILE="$(find /tmp/silentblade -name project.godot -type f -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          test -d "$PROJECT_DIR/scripts"
          test -d "$PROJECT_DIR/scenes"
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$PROJECT_DIR/" ./

      - name: Verify project
        run: |
          set -euo pipefail
          test -f project.godot
          test -d scripts/mission
          find scripts/mission -name '*.gd' -type f

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update SilentBlade to v0.8"
          git push
          
