name: Unpack SilentBlade v0.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v0.5
        run: |
          set -euo pipefail
          mkdir -p /tmp/silentblade
          unzip -q SilentBlade_v0.5_source.zip -d /tmp/silentblade
          test -f /tmp/silentblade/project.godot
          rsync -a --exclude='.github/' /tmp/silentblade/ ./

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update SilentBlade to v0.5"
          git push
          
