
name: Unpack SilentBlade source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          mkdir -p /tmp/silentblade
          unzip -q SilentBlade_v0.3.1_source.zip -d /tmp/silentblade
          test -f /tmp/silentblade/SilentBlade/project.godot
          rsync -a /tmp/silentblade/SilentBlade/ ./

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract SilentBlade v0.3.1 project"
          git push
          
