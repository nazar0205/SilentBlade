
name: Godot 4.3 Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'scripts/**'
      - 'scenes/**'
      - 'data/**'
      - 'tests/godot/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Load main scene
        run: godot --headless --path . --quit-after 10

      - name: Gameplay and multitouch tests
        run: godot --headless --path . -s tests/godot/gameplay_smoke_test.gd

      - name: Mission systems tests
        run: godot --headless --path . -s tests/godot/mission_systems_test.gd

      - name: Stealth and AI tests
        run: godot --headless --path . -s tests/godot/stealth_ai_test.gd
        
