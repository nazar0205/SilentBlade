
name: Godot validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.godot'
      - 'scripts/**'
      - 'scenes/**'
      - 'data/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Check GDScript
        run: |
          for file in scripts/*.gd; do
            echo "Checking $file"
            godot --headless --path . --check-only --script "$file"
          done

      - name: Load main scene
        run: godot --headless --path . --quit-after 5
        
