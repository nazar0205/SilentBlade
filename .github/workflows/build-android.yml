
name: Build Silent Blade Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Export Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Android export
        run: |
          mkdir -p ~/.config/godot

          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/SilentBlade-v0.5-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk="23"
          gradle_build/target_sdk="34"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.silentblade.game"
          package/name="Silent Blade"
          package/signed=true
          version/code=5
          version/name="0.5"
          screen/immersive_mode=true
          user_data_backup/allow=false
          permissions/internet=false
          EOF

      - name: Import project
        run: |
          godot --headless --editor --path . --quit

      - name: Export APK
        run: |
          mkdir -p build

          godot --headless --path . \
            --export-debug "Android" \
            build/SilentBlade-v0.5-debug.apk

          test -s build/SilentBlade-v0.5-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SilentBlade-v0.5-Android
          path: build/SilentBlade-v0.5-debug.apk
          if-no-files-found: error
          retention-days: 14
          
